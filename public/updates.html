<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Miranda's Updates – Fan Membership</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Georgia', serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
    }

    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 48px;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(8px);
      z-index: 100;
    }

    nav .logo {
      font-size: 1.2rem;
      font-weight: bold;
      letter-spacing: 2px;
      color: #c9a84c;
      text-transform: uppercase;
      text-decoration: none;
    }

    nav a.nav-link {
      color: #ddd;
      text-decoration: none;
      font-size: 0.9rem;
      letter-spacing: 1px;
      transition: color 0.2s;
    }

    nav a.nav-link:hover { color: #c9a84c; }

    /* PAGE HEADER */
    .page-header {
      text-align: center;
      padding: 110px 24px 32px;
    }

    .page-header .badge {
      font-size: 0.75rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #c9a84c;
      border: 1px solid #c9a84c;
      padding: 5px 16px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 16px;
    }

    .page-header h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); margin-bottom: 10px; }
    .page-header h1 span { color: #c9a84c; }
    .page-header p { font-size: 0.9rem; color: #777; line-height: 1.6; }

    /* ADMIN PANEL */
    .admin-panel {
      display: none;
      max-width: 680px;
      margin: 0 auto 40px;
      padding: 0 24px;
    }

    .admin-panel.visible { display: block; }

    .admin-card {
      background: #111;
      border: 1px solid #c9a84c44;
      border-radius: 10px;
      padding: 28px;
      margin-bottom: 32px;
    }

    .admin-card h3 {
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #c9a84c;
      margin-bottom: 16px;
    }

    .admin-card textarea {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 4px;
      color: #fff;
      font-family: 'Georgia', serif;
      font-size: 0.95rem;
      padding: 12px 14px;
      outline: none;
      resize: vertical;
      min-height: 100px;
      transition: border-color 0.2s;
      margin-bottom: 12px;
    }

    .admin-card textarea:focus { border-color: #c9a84c; }
    .admin-card textarea::placeholder { color: #444; }

    .admin-card input[type="text"],
    .admin-card input[type="file"] {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 4px;
      color: #fff;
      font-family: 'Georgia', serif;
      font-size: 0.9rem;
      padding: 10px 14px;
      outline: none;
      margin-bottom: 12px;
      transition: border-color 0.2s;
    }

    .admin-card input[type="text"]:focus { border-color: #c9a84c; }
    .admin-card input[type="file"] { color: #888; cursor: pointer; }

    .btn-post {
      background: #c9a84c;
      color: #0a0a0a;
      font-family: 'Georgia', serif;
      font-size: 0.85rem;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 12px 28px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-post:hover { background: #e0bf6a; }

    /* ADMIN LOGIN */
    .admin-login {
      max-width: 400px;
      margin: 0 auto 40px;
      padding: 0 24px;
      display: none;
    }

    .admin-login.visible { display: block; }

    .login-card {
      background: #111;
      border: 1px solid #222;
      border-radius: 10px;
      padding: 28px;
    }

    .login-card h3 {
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #c9a84c;
      margin-bottom: 16px;
    }

    .login-card input {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 4px;
      color: #fff;
      font-family: 'Georgia', serif;
      font-size: 0.95rem;
      padding: 12px 14px;
      outline: none;
      margin-bottom: 12px;
      transition: border-color 0.2s;
    }

    .login-card input:focus { border-color: #c9a84c; }
    .login-card input::placeholder { color: #444; }

    /* UPDATES FEED */
    .updates-wrap {
      max-width: 680px;
      margin: 0 auto 80px;
      padding: 0 24px;
    }

    .no-updates {
      text-align: center;
      color: #444;
      font-size: 0.9rem;
      padding: 60px 0;
      letter-spacing: 1px;
    }

    .update-card {
      background: #111;
      border: 1px solid #222;
      border-radius: 10px;
      padding: 24px 28px;
      margin-bottom: 20px;
      position: relative;
    }

    .update-card .update-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .update-card .avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: #c9a84c;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
      color: #0a0a0a;
      font-weight: bold;
      flex-shrink: 0;
    }

    .update-card .meta-info .name {
      font-size: 0.85rem;
      font-weight: bold;
      color: #c9a84c;
      letter-spacing: 1px;
    }

    .update-card .meta-info .date {
      font-size: 0.72rem;
      color: #555;
      letter-spacing: 1px;
    }

    .update-card .update-text {
      font-size: 0.92rem;
      color: #ccc;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .update-card .update-img {
      width: 100%;
      max-height: 360px;
      object-fit: cover;
      border-radius: 6px;
      margin-top: 14px;
    }

    .update-card .delete-btn {
      position: absolute;
      top: 16px; right: 16px;
      background: transparent;
      border: 1px solid #333;
      color: #555;
      font-size: 0.7rem;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      display: none;
      font-family: 'Georgia', serif;
      transition: border-color 0.2s, color 0.2s;
    }

    .update-card .delete-btn:hover { border-color: #e74c3c; color: #e74c3c; }

    .admin-active .delete-btn { display: block; }

    /* ADMIN TOGGLE */
    .admin-toggle {
      text-align: center;
      margin-bottom: 24px;
    }

    .btn-admin {
      background: transparent;
      border: 1px solid #333;
      color: #555;
      font-family: 'Georgia', serif;
      font-size: 0.72rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 6px 16px;
      border-radius: 4px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    .btn-admin:hover { border-color: #c9a84c; color: #c9a84c; }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 24px;
      border-top: 1px solid #1a1a1a;
    }

    @media (max-width: 520px) {
      nav { padding: 16px 20px; }
      .update-card { padding: 18px; }
    }
  </style>
</head>
<body>

  <nav>
<a href="index.html" class="logo">Miranda Lambert</a>
    <a href="pending.html" class="nav-link">← Back</a>
  </nav>

  <div class="page-header">
    <div class="badge">Members Only</div>
<h1>Miranda's <span>Updates</span></h1>
<p>Exclusive updates, announcements and messages from Miranda.</p>
  </div>

  <!-- ADMIN LOGIN -->
  <div class="admin-login" id="admin-login">
    <div class="login-card">
      <h3>🔐 Admin Access</h3>
      <input type="password" id="admin-pass" placeholder="Enter admin password" />
      <button class="btn-post" onclick="adminLogin()">Login</button>
    </div>
  </div>

  <!-- ADMIN POST PANEL -->
  <div class="admin-panel" id="admin-panel">
    <div class="admin-card">
      <h3>✏️ Post a New Update</h3>
      <input type="text" id="post-title" placeholder="Title (optional)" />
      <textarea id="post-text" placeholder="Write your update here..."></textarea>
      <input type="file" id="post-image" accept="image/*" />
      <button class="btn-post" onclick="postUpdate()">Post Update</button>
    </div>
  </div>

  <!-- UPDATES FEED -->
  <div class="updates-wrap" id="updates-wrap">
    <div class="no-updates" id="no-updates">No updates yet. Check back soon! 🌟</div>
  </div>

  <!-- FOOTER -->
  <footer>
    <a href="https://wa.me/18067025788" target="_blank" style="display:inline-flex;align-items:center;gap:8px;background:#25D366;color:#fff;font-family:'Georgia',serif;font-size:0.85rem;font-weight:bold;letter-spacing:1px;padding:12px 24px;border-radius:30px;text-decoration:none;">
      <span style="font-size:1.2rem;">💬</span> Chat on WhatsApp
    </a>
    <p style="color:#444;font-size:0.75rem;margin-top:10px;letter-spacing:1px;">+1 (806) 702-5788</p>
    <p style="color:#c9a84c;font-size:0.7rem;text-transform:uppercase;letter-spacing:2px;margin-top:12px;">Certified by Texas</p>
  </footer>

  <script>
    const ADMIN_PASSWORD = 'miranda2025';
    let isAdmin = false;

    // Load updates from localStorage
    function loadUpdates() {
      const updates = JSON.parse(localStorage.getItem('mirandaUpdates') || '[]');
      const wrap = document.getElementById('updates-wrap');
      const noUpdates = document.getElementById('no-updates');

      const existing = wrap.querySelectorAll('.update-card');
      existing.forEach(el => el.remove());

      if (updates.length === 0) {
        noUpdates.style.display = 'block';
        return;
      }

      noUpdates.style.display = 'none';

      updates.slice().reverse().forEach((u, i) => {
        const realIndex = updates.length - 1 - i;
        const card = document.createElement('div');
        card.className = 'update-card' + (isAdmin ? ' admin-active' : '');
        card.innerHTML = `
          <button class="delete-btn" onclick="deleteUpdate(${realIndex})">✕ Delete</button>
          <div class="update-meta">
            <div class="avatar">M</div>
            <div class="meta-info">
              <div class="name">Miranda Lambert</div>
              <div class="date">${u.date}</div>
            </div>
          </div>
          ${u.title ? `<p style="font-size:1rem;font-weight:bold;color:#fff;margin-bottom:8px;">${u.title}</p>` : ''}
          <div class="update-text">${u.text}</div>
          ${u.image ? `<img src="${u.image}" class="update-img" alt="Update image" />` : ''}
        `;
        wrap.appendChild(card);
      });
    }

    function postUpdate() {
      const title = document.getElementById('post-title').value.trim();
      const text  = document.getElementById('post-text').value.trim();
      const file  = document.getElementById('post-image').files[0];

      if (!text) { alert('Please write something before posting.'); return; }

      const save = (imageData) => {
        const updates = JSON.parse(localStorage.getItem('mirandaUpdates') || '[]');
        updates.push({
          title,
          text,
          image: imageData || null,
          date: new Date().toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit' })
        });
        localStorage.setItem('mirandaUpdates', JSON.stringify(updates));
        document.getElementById('post-title').value = '';
        document.getElementById('post-text').value  = '';
        document.getElementById('post-image').value = '';
        loadUpdates();
      };

      if (file) {
        const reader = new FileReader();
        reader.onload = e => save(e.target.result);
        reader.readAsDataURL(file);
      } else {
        save(null);
      }
    }

    function deleteUpdate(index) {
      if (!confirm('Delete this update?')) return;
      const updates = JSON.parse(localStorage.getItem('mirandaUpdates') || '[]');
      updates.splice(index, 1);
      localStorage.setItem('mirandaUpdates', JSON.stringify(updates));
      loadUpdates();
    }

    function toggleAdminLogin() {
      const login = document.getElementById('admin-login');
      login.classList.toggle('visible');
    }

    function adminLogin() {
      const pass = document.getElementById('admin-pass').value;
      if (pass === ADMIN_PASSWORD) {
        isAdmin = true;
        document.getElementById('admin-login').classList.remove('visible');
        document.getElementById('admin-panel').classList.add('visible');
        loadUpdates();
      } else {
        alert('Incorrect password.');
      }
    }

    loadUpdates();
  </script>

</body>
</html>
