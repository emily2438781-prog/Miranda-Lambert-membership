<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Miranda Updates – Fan Membership</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "Georgia", serif; background: #0a0a0a; color: #fff; min-height: 100vh; }
    nav { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 18px 48px; background: rgba(0,0,0,0.55); backdrop-filter: blur(8px); z-index: 100; }
    nav .logo { font-size: 1.2rem; font-weight: bold; letter-spacing: 2px; color: #c9a84c; text-transform: uppercase; text-decoration: none; }
    nav a.nav-link { color: #ddd; text-decoration: none; font-size: 0.9rem; letter-spacing: 1px; transition: color 0.2s; }
    nav a.nav-link:hover { color: #c9a84c; }
    .page-header { text-align: center; padding: 110px 24px 32px; }
    .page-header .badge { font-size: 0.75rem; letter-spacing: 4px; text-transform: uppercase; color: #c9a84c; border: 1px solid #c9a84c; padding: 5px 16px; border-radius: 20px; display: inline-block; margin-bottom: 16px; }
    .page-header h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); margin-bottom: 10px; }
    .page-header h1 span { color: #c9a84c; }
    .page-header p { font-size: 0.9rem; color: #777; line-height: 1.6; }
    .updates-wrap { max-width: 680px; margin: 0 auto 80px; padding: 0 24px; }
    .no-updates { text-align: center; color: #444; font-size: 0.9rem; padding: 60px 0; letter-spacing: 1px; }
    .update-card { background: #111; border: 1px solid #222; border-radius: 10px; padding: 24px 28px; margin-bottom: 20px; }
    .update-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; background: #c9a84c; display: flex; align-items: center; justify-content: center; font-size: 1rem; color: #0a0a0a; font-weight: bold; flex-shrink: 0; }
    .meta-info .name { font-size: 0.85rem; font-weight: bold; color: #c9a84c; letter-spacing: 1px; }
    .meta-info .date { font-size: 0.72rem; color: #555; letter-spacing: 1px; }
    .update-text { font-size: 0.92rem; color: #ccc; line-height: 1.7; white-space: pre-wrap; }
    .update-img { width: 100%; max-height: 360px; object-fit: cover; border-radius: 6px; margin-top: 14px; }
    footer { text-align: center; padding: 24px; border-top: 1px solid #1a1a1a; }
    @media (max-width: 520px) { nav { padding: 16px 20px; } .update-card { padding: 18px; } }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="logo">Miranda Lambert</a>
    <a href="pending.html" class="nav-link">← Back</a>
  </nav>
  <div class="page-header">
    <div class="badge">Members Only</div>
    <h1>Miranda Updates</h1>
    <p>Exclusive announcements, messages, and member posts from Miranda.</p>
  </div>
  <div class="updates-wrap" id="updates-wrap">
    <div class="no-updates" id="no-updates">No updates yet. Check back soon! 🌟</div>
  </div>
  <footer>
    <a href="https://wa.me/18067025788" target="_blank" style="display:inline-flex;align-items:center;gap:8px;background:#25D366;color:#fff;font-family:\"Georgia\",serif;font-size:0.85rem;font-weight:bold;letter-spacing:1px;padding:12px 24px;border-radius:30px;text-decoration:none;">
      <span style="font-size:1.2rem;">💬</span> Chat on WhatsApp
    </a>
    <p style="color:#444;font-size:0.75rem;margin-top:10px;letter-spacing:1px;">+1 (806) 702-5788</p>
    <p style="color:#c9a84c;font-size:0.7rem;text-transform:uppercase;letter-spacing:2px;margin-top:12px;">Certified by Texas</p>
  </footer>
  <script>
    function getStoredUpdates() {
      const saved = localStorage.getItem("mirandaUpdates") || localStorage.getItem("emilyUpdates");
      let updates = [];
      try { updates = JSON.parse(saved || "[]"); } catch (err) { updates = []; }
      if (!localStorage.getItem("mirandaUpdates") && localStorage.getItem("emilyUpdates")) {
        localStorage.setItem("mirandaUpdates", JSON.stringify(updates));
      }
      return Array.isArray(updates) ? updates : [];
    }
    function loadUpdates() {
      const updates = getStoredUpdates();
      const wrap = document.getElementById("updates-wrap");
      const noUpdates = document.getElementById("no-updates");
      wrap.querySelectorAll(".update-card").forEach(el => el.remove());
      if (!updates.length) {
        noUpdates.style.display = "block";
        return;
      }
      noUpdates.style.display = "none";
      updates.slice().reverse().forEach(u => {
        const card = document.createElement("div");
        card.className = "update-card";
        card.innerHTML =
          '<div class="update-meta">' +
            '<div class="avatar">M</div>' +
            '<div class="meta-info">' +
              '<div class="name">Miranda Lambert</div>' +
              '<div class="date">' + (u.date || "") + '</div>' +
            '</div>' +
          '</div>' +
          (u.title ? '<p style="font-size:1rem;font-weight:bold;color:#fff;margin-bottom:8px;">' + u.title + '</p>' : '') +
          '<div class="update-text">' + (u.text || "") + '</div>' +
          (u.image ? '<img src="' + u.image + '" class="update-img" alt="Update image" />' : '');
        wrap.appendChild(card);
      });
    }
    loadUpdates();
  </script>
</body>
</html>
